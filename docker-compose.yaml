services:
  postgres:
    image: postgres:16-alpine
    container_name: iam-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iam_service}
      POSTGRES_USER: ${DB_USERNAME:-iam_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-iam_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - iam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-iam_user} -d ${POSTGRES_DB:-iam_service}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: iam-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - iam_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  iam_postgres_data:
  iam_redis_data:
