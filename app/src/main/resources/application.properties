spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/iam_service}
spring.datasource.username=${DB_USERNAME:iam_user}
spring.datasource.password=${DB_PASSWORD:iam_password}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
# print the SQL, useful while learning
spring.jpa.show-sql=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

app.mail.from=${MAIL_FROM:${MAIL_USERNAME:noreply@example.com}}
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-at-least-32-bytes-long}
app.jwt.access-expiration-seconds=900
app.jwt.refresh-expiration-seconds=10800
app.cache.profile-ttl-seconds=600
app.password-reset.code-ttl-seconds=600
app.password-reset.max-attempts=5
